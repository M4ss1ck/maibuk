const needsApproval=s=>needsReview(s)||!hasRequired(s);
function transition(s,a){
 s=structuredClone(s);
 switch(a.type){
 case 'approve': if(a.files!==s.files||!s.required.every(p=>a.grants.includes(p)))return s;s.approved=s.files;s.grants=a.grants.filter(p=>s.requested.includes(p));s.previous=[...s.requested];s.previousRequired=[...s.required];s.enabled=true;s.notice=false;break;
 case 'toggle': if(s.enabled)s.enabled=false;else if(!needsApproval(s))s.enabled=true;break;
 case 'dismissNotice':s.notice=false;break;
 case 'change': if(s.enabled&&!s.dev)s.notice=true;s.files=s.files==='A'?'B':s.files+'B';s.modified=s.kind==='builtin';if(a.permissions)s.requested=s.requested.filter(p=>p!=='secrets').concat(s.requested.includes('network:uploads.example.com')?[]:['network:uploads.example.com']);if(a.requireOptional){const optional=s.requested.find(p=>!s.required.includes(p));if(optional)s.required.push(optional)}s.grants=s.grants.filter(p=>s.requested.includes(p));if(!s.dev||!hasRequired(s))s.enabled=false;break;
 case 'grant': if(s.requested.includes(a.permission)){s.grants=s.grants.filter(p=>p!==a.permission);if(a.allowed)s.grants.push(a.permission);else if(s.required.includes(a.permission))s.enabled=false}break;
 case 'updateAvailable': if(s.kind==='builtin'){s.update=true;if(!s.modified){s.files='shipped-2';s.approved=s.files;s.update=false}}break;
 case 'replace': if(s.kind==='builtin'&&s.update){s.files='shipped-2';s.approved=s.files;s.modified=false;s.update=false}break;
 case 'dev':s.dev=a.enabled;if(!s.dev&&needsReview(s))s.enabled=false;break;
 case 'call': s.call=!s.enabled?'stopped':!s.grants.includes(a.permission)?'denied':'allowed';break;
 case 'resetSettings':s.notice=false;s.settings=false;s.credentials=false;s.dev=false;s.call=null;if(s.kind==='builtin'&&!s.modified){s.approved=s.files;s.grants=[...s.requested];s.enabled=true}else{s.approved=null;s.grants=[];s.enabled=false}break;
 case 'resetLibrary':s.library=false;break;
 }
 return s;
}

if(s.kind==='frame')body.push(paragraph(t('frame')));
show('reviewTitle',body,[button('cancel',close),button('approve',()=>{if(files!==s.files){$('dialogBody').prepend(paragraph(t('changedWhileOpen')));return}dispatch({type:'approve',files,grants:[...draft]});close()},true)])}
function permissions(){const body=[paragraph(t('grantIntro'))];for(const p of s.requested){const row=document.createElement('div'),label=document.createElement('label'),input=document.createElement('input'),required=s.required.includes(p);row.className='permission';input.type='checkbox';input.checked=s.grants.includes(p);input.disabled=required;input.onchange=()=>dispatch({type:'grant',permission:p,allowed:input.checked});label.append(input,permission(p)[0]+' · '+t(required?'requiredLabel':'optionalLabel'));row.append(label);if(required&&s.grants.includes(p))row.append(button('revokeRequired',()=>{dispatch({type:'grant',permission:p,allowed:false});close()}));else if(required)row.append(paragraph(t('requiredMissing')));body.push(row)}show('grantTitle',body,[button('close',close)])}
function confirm(title,body,key,action){show(title,[paragraph(t(body))],[button('cancel',close),button(key,()=>{dispatch(action);close()},true)])}
function act(a){if(a==='review')review();if(a==='change'||a==='diff')dispatch({type:'change',permissions:a==='diff'});if(a==='offer')dispatch({type:'updateAvailable'});if(a==='replace'&&s.update)show('replaceTitle',[paragraph(t('replaceBody'))],[button('keep',close),button('replace',()=>{dispatch({type:'replace'});close()},true)]);if(a==='permissions')permissions();if(a==='call')dispatch({type:'call',permission:s.requested.includes('library:read')?'library:read':s.requested[0]});if(a==='reset')confirm('resetTitle','resetBody','reset',{type:'resetSettings'});if(a==='library')confirm('libraryTitle','libraryBody','resetLibrary',{type:'resetLibrary'});if(a==='dev'){if(s.dev)dispatch({type:'dev',enabled:false});else confirm('devTitle','devBody','devEnable',{type:'dev',enabled:true})}}
function render(){document.documentElement.lang=lang;for(const id of ['title','intro','scope','guidedTitle','scenarioLabel','start','accessTitle','stateTitle','freeTitle','freeDescription','proposalTitle','proposal'])$(id).textContent=t(id);
$('scenario').replaceChildren(...scenarios.map(([name],i)=>{const o=document.createElement('option');o.value=i;o.textContent=t('scenario'+name);return o}));$('scenario').value=scenarioIndex;const sc=scenarios[scenarioIndex];$('scenarioDescription').textContent=t('desc'+sc[0]);$('next').disabled=step>=sc[2].length;$('next').textContent=step>=sc[2].length?t('done'):`${step+1}/${sc[2].length} · ${t(labels[sc[2][step]])}`;
$('changedNotice').hidden=!s.notice;$('changedNoticeText').textContent=t('changedNotice').replace('{name}',s.name);$('noticeReview').textContent=t('noticeReview');$('noticeDismiss').textContent=t('noticeDismiss');$('pluginName').textContent=s.name;$('status').textContent=t(needsReview(s)?'review':s.enabled?'on':'off');$('origin').textContent=t(s.kind==='builtin'?'builtin':'third');$('frame').hidden=s.kind!=='frame';$('frame').textContent=t('frame');$('reason').textContent=t(needsReview(s)?s.approved?'changedReason':'newReason':!hasRequired(s)?'requiredMissing':s.dev?'devReason':'readyReason');$('enable').textContent=t(s.enabled?'disable':needsApproval(s)?'enable':'turnOn');$('permissions').textContent=t('permissions');$('permissions').disabled=needsReview(s);$('update').textContent=t('update');$('update').hidden=!s.update;
$('access').replaceChildren(...s.requested.map(p=>paragraph(`${s.grants.includes(p)?'✓':'○'} ${permission(p)[0]} · ${t(s.required.includes(p)?'requiredLabel':'optionalLabel')}`)));
const fields={files:s.files,approved:s.approved||t('none'),grants:s.grants.map(p=>permission(p)[0]).join(', ')||t('none'),modified:t(s.modified?'yes':'no'),available:t(s.update?'yes':'no'),credentials:t(s.credentials?'kept':'cleared'),library:t(s.library?'kept':'cleared'),settings:t(s.settings?'kept':'default'),development:t(s.dev?'yes':'no'),callPermission:permission(s.requested.includes('library:read')?'library:read':s.requested[0])[0]};$('state').replaceChildren(...Object.entries(fields).flatMap(([key,value])=>{const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=t(key);dd.textContent=value;return[dt,dd]}));
if(!$('free').children.length||$('free').dataset.lang!==lang){$('free').dataset.lang=lang;$('free').replaceChildren(...[['newThird',()=>reset('third')],['newBuiltin',()=>reset('builtin')],['newFrame',()=>reset('frame')],['change',()=>act('change')],['changePermissions',()=>act('diff')],['requireOptional',()=>dispatch({type:'change',requireOptional:true})],['updateEvent',()=>act('offer')],['tryCall',()=>act('call')],['dev',()=>act('dev')],['resetSettings',()=>act('reset')],['resetLibrary',()=>act('library')]].map(([k,f])=>button(k,f)))}}
function reset(kind){s=initial(kind);step=0;render();$('log').textContent=''}
$('noticeReview').onclick=review;$('noticeDismiss').onclick=()=>dispatch({type:'dismissNotice'});
$('language').onchange=e=>{lang=e.target.value;render()};$('scenario').onchange=e=>{scenarioIndex=Number(e.target.value);reset(scenarios[scenarioIndex][1])};$('start').onclick=()=>reset(scenarios[scenarioIndex][1]);$('next').onclick=()=>{const a=scenarios[scenarioIndex][2][step++];act(a);render()};$('enable').onclick=()=>s.enabled?dispatch({type:'toggle'}):needsApproval(s)?review():dispatch({type:'toggle'});$('permissions').onclick=permissions;$('update').onclick=()=>act('replace');render();
</script>
</html>
