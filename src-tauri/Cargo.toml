[package]
name = "maibuk"
version = "0.19.2"
description = "A cross-platform writing app for authors"
authors = ["M4ss1ck"]
edition = "2021"

[lib]
name = "maibuk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "=0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
libsqlite3-sys = { version = "=0.30.1", default-features = false }
tauri-plugin-os = "2.3.2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-http = "2"
base64 = "0.22"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate", "deflate64"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
notify = "8"
notify-debouncer-full = "0.7"
# The Plugin Endpoint listener (ADR 0031). All of these are already in the lock
# as transitives; versions here keep them there.
hyper = { version = "1.8", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["net", "sync", "rt", "macros", "time"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"
gdkx11 = "0.18"
cpal = "0.18"
libloading = "0.8"
sherpa-onnx = "=1.13.8"
ureq = "2"
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust", "vendored"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"
# Resource Usage (#668): the process table with each process's private working
# set, and the machine's CPU times and RAM. Already in the lock via tauri.
windows-sys = { version = "0.61", features = [
  "Wdk_System_SystemInformation",
  "Win32_Foundation",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
keyring-core = "1"
tauri-plugin-updater = "2.10"

# Smaller, faster native code: one codegen unit and fat LTO let LLVM inline
# across crates, and stripping drops the symbol tables from the shipped binary.
[profile.release]
codegen-units = 1
lto = true
strip = true
