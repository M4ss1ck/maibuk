<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Clock</title>
    <style>
      :root {
        color-scheme: var(--maibuk-color-scheme, light dark);
      }

      * {
        box-sizing: border-box;
      }

      /* `hidden` has to win over the `display` rules the panels set. */
      [hidden] {
        /* biome-ignore lint/complexity/noImportantStyles: the panel display rules outrank [hidden] without it */
        display: none !important;
      }

      html {
        font-size: var(--maibuk-font-size, 16px);
      }

      html,
      body {
        margin: 0;
      }

      body {
        min-height: 100vh;
        background: var(--maibuk-color-background);
        color: var(--maibuk-color-foreground);
        font-family: var(--maibuk-font-sans, system-ui, sans-serif);
      }

      button {
        font-family: inherit;
        cursor: pointer;
      }

      input {
        font-family: inherit;
      }

      #clock {
        max-width: 1040px;
        margin: 0 auto;
        padding: 32px 24px 48px;
        display: flex;
        flex-direction: column;
        gap: 28px;
      }

      header {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
        justify-content: space-between;
      }

      .tabs {
        display: flex;
        gap: 4px;
        padding: 4px;
        background: color-mix(in srgb, var(--maibuk-color-muted) 55%, var(--maibuk-color-background));
        border: 1px solid var(--maibuk-color-border);
        border-radius: 14px;
      }

      .tab {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 40px;
        padding: 0 16px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: var(--maibuk-color-muted-foreground);
        font-size: 0.875rem;
        font-weight: 500;
      }

      .tab[aria-selected="true"] {
        background: var(--maibuk-color-card);
        color: var(--maibuk-color-card-foreground);
        font-weight: 600;
        box-shadow: 0 1px 2px
          color-mix(in srgb, var(--maibuk-color-foreground) 12%, transparent);
      }

      .tab svg {
        flex: 0 0 auto;
      }

      .tab .dot {
        width: 6px;
        height: 6px;
        border-radius: 3px;
        background: var(--maibuk-color-primary);
      }

      .today {
        margin: 0;
        font-size: 0.875rem;
        color: var(--maibuk-color-muted-foreground);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      .banner {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 16px;
        padding: 12px 12px 12px 16px;
        border-radius: 14px;
        background: var(--maibuk-color-warning-bg);
        border: 1px solid color-mix(in srgb, var(--maibuk-color-warning-text) 25%, transparent);
        color: var(--maibuk-color-warning-text);
        font-size: 0.875rem;
      }

      .banner .banner-text {
        flex: 1 1 240px;
      }

      .banner button {
        min-height: 36px;
        padding: 0 14px;
        border-radius: 10px;
        border: 1px solid currentColor;
        background: transparent;
        color: var(--maibuk-color-warning-text);
        font-size: 0.8125rem;
        font-weight: 600;
      }

      .layout {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        align-items: stretch;
      }

      .hero {
        flex: 999 1 520px;
        min-width: 0;
        background: var(--maibuk-color-card);
        color: var(--maibuk-color-card-foreground);
        border: 1px solid var(--maibuk-color-border);
        border-radius: 24px;
        padding: 40px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
        box-shadow: 0 12px 32px -16px
          color-mix(in srgb, var(--maibuk-color-foreground) 18%, transparent);
      }

      .hero-timer {
        padding: 48px 24px;
        gap: 36px;
      }

      .side {
        flex: 1 1 300px;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .card {
        background: var(--maibuk-color-card);
        color: var(--maibuk-color-card-foreground);
        border: 1px solid var(--maibuk-color-border);
        border-radius: 20px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .card.tight {
        gap: 10px;
      }

      .card h2 {
        margin: 0;
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--maibuk-color-muted-foreground);
      }

      .phase-pill {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--maibuk-color-primary) 14%, transparent);
        font-size: 0.8125rem;
        font-weight: 600;
      }

      .phase-pill .phase-dot {
        width: 8px;
        height: 8px;
        border-radius: 4px;
        background: var(--maibuk-color-primary);
      }

      .dial {
        position: relative;
        width: 320px;
        height: 320px;
        max-width: 100%;
      }

      .dial svg {
        display: block;
        max-width: 100%;
        height: auto;
      }

      .dial-content {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }

      .dial-time {
        font-size: 4.75rem;
        font-weight: 300;
        letter-spacing: -0.04em;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }

      .dial-sub {
        font-size: 0.875rem;
        color: var(--maibuk-color-muted-foreground);
      }

      .ring-track {
        fill: none;
        stroke: var(--maibuk-color-muted);
        stroke-width: 10;
      }

      .ring-value {
        fill: none;
        stroke: var(--maibuk-color-primary);
        stroke-width: 10;
        stroke-linecap: round;
      }

      .ticks line {
        stroke: var(--maibuk-color-muted-foreground);
        stroke-linecap: round;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .round {
        width: 48px;
        height: 48px;
        padding: 0;
        border-radius: 24px;
        border: 1px solid var(--maibuk-color-border);
        background: var(--maibuk-color-card);
        color: var(--maibuk-color-muted-foreground);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .primary {
        min-width: 160px;
        height: 60px;
        padding: 0 32px;
        border-radius: 30px;
        border: 0;
        background: var(--maibuk-color-primary);
        color: var(--maibuk-color-primary-foreground);
        font-size: 1.0625rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-shadow: 0 8px 20px -8px var(--maibuk-color-primary);
      }

      .primary:hover {
        background: var(--maibuk-color-primary-hover);
      }

      .primary-wide {
        min-width: 200px;
        padding: 0 36px;
        box-shadow: 0 10px 28px -10px var(--maibuk-color-primary);
      }

      .setup {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 36px;
      }

      .fieldset {
        border: 0;
        margin: 0;
        padding: 0;
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }

      .field {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .field input {
        width: 132px;
        height: 112px;
        border-radius: 20px;
        border: 1px solid var(--maibuk-color-border);
        background: var(--maibuk-color-background);
        color: var(--maibuk-color-foreground);
        font-size: 4.5rem;
        font-weight: 300;
        letter-spacing: -0.04em;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }

      .field input:focus-visible {
        border-color: var(--maibuk-color-primary);
        outline: 2px solid var(--maibuk-color-primary);
        outline-offset: 2px;
      }

      .field label {
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--maibuk-color-muted-foreground);
      }

      .field-separator {
        font-size: 4.5rem;
        font-weight: 300;
        line-height: 112px;
        color: var(--maibuk-color-muted-foreground);
      }

      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      input[type="number"] {
        -moz-appearance: textfield;
      }

      /* The app styles every scrollbar itself, but the Frame's opaque origin
         keeps those rules out, so the same bar is drawn here from the theme
         tokens the host writes. */
      /* Firefox. Chromium would take these too, and then draw arrow buttons and
         ignore the rounded thumb below, so only engines without it get them. */
      @supports not selector(::-webkit-scrollbar) {
        * {
          scrollbar-width: thin;
          /* The solid pair stands in for engines without color-mix(). */
          scrollbar-color: var(--maibuk-color-muted-foreground) var(--maibuk-color-background);
          /* biome-ignore lint/suspicious/noDuplicateProperties: the plain pair above is the fallback for engines that cannot resolve color-mix() */
          scrollbar-color: color-mix(in srgb, var(--maibuk-color-muted-foreground) 45%, transparent)
            transparent;
        }
      }

      /* Chromium, Safari, and the Linux desktop webview. */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      /* Where a vertical and a horizontal scrollbar meet; the engine paints it
         white otherwise. */
      ::-webkit-scrollbar-corner {
        background: transparent;
      }

      /* The root scroller's track backs onto the webview's own base color,
         which stays white in the dark theme; the Frame's canvas does not
         extend under it the way the app's page does. Painting it like the
         page leaves the same pixels the app's transparent track shows. */
      html::-webkit-scrollbar-track {
        background: var(--maibuk-color-background);
      }

      html::-webkit-scrollbar-corner {
        background: var(--maibuk-color-background);
      }

      ::-webkit-scrollbar-thumb {
        border: 2px solid transparent;
        border-radius: 9999px;
        background-clip: padding-box;
        /* WebKitGTK's scrollbar paint reads an unresolved color-mix() as no
           color at all and skips the thumb; the token's solid color stands in
           first, and every engine that resolves the mix takes that instead. */
        background-color: var(--maibuk-color-muted-foreground);
        /* biome-ignore lint/suspicious/noDuplicateProperties: the plain color above is the fallback for engines that cannot resolve color-mix() */
        background-color: color-mix(in srgb, var(--maibuk-color-muted-foreground) 45%, transparent);
      }

      .recent {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .recent-label {
        font-size: 0.8125rem;
        color: var(--maibuk-color-muted-foreground);
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
      }

      .chip {
        min-height: 40px;
        padding: 0 16px;
        border-radius: 20px;
        border: 1px solid var(--maibuk-color-border);
        background: transparent;
        color: var(--maibuk-color-foreground);
        font-size: 0.875rem;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }

      .chip[aria-pressed="true"] {
        background: color-mix(in srgb, var(--maibuk-color-primary) 16%, transparent);
        border-color: var(--maibuk-color-primary);
      }

      .cycle-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .cycle-step {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 36px;
        padding: 0 10px;
        border-radius: 10px;
      }

      .cycle-step.now {
        background: color-mix(in srgb, var(--maibuk-color-muted) 45%, transparent);
      }

      .cycle-step .step-dot {
        width: 10px;
        height: 10px;
        border-radius: 5px;
        background: transparent;
        border: 2px solid var(--maibuk-color-border);
      }

      .cycle-step.pomodoro:not(.next) .step-dot {
        background: var(--maibuk-color-primary);
        border-color: var(--maibuk-color-primary);
      }

      .cycle-step.break:not(.next) .step-dot {
        background: var(--maibuk-color-success);
        border-color: var(--maibuk-color-success);
      }

      .cycle-step .step-label {
        flex: 1;
        font-size: 0.875rem;
        color: var(--maibuk-color-foreground);
      }

      .cycle-step.done .step-label {
        color: var(--maibuk-color-muted-foreground);
      }

      .cycle-step.now .step-label {
        font-weight: 600;
      }

      .cycle-step .step-length {
        font-size: 0.8125rem;
        color: var(--maibuk-color-muted-foreground);
        font-variant-numeric: tabular-nums;
      }

      /* The lengths row is a button, so the look it had as a div is reset back
         on: full width, left-aligned, transparent, in the page's own font. */
      .lengths {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 48px;
        padding: 0 20px;
        border-radius: 14px;
        border: 1px dashed var(--maibuk-color-border);
        background: transparent;
        color: var(--maibuk-color-muted-foreground);
        font-size: 0.875rem;
        font-weight: 500;
        text-align: left;
        cursor: pointer;
      }

      .lengths:hover {
        background: color-mix(in srgb, var(--maibuk-color-muted) 45%, transparent);
        border-color: var(--maibuk-color-muted-foreground);
      }

      .lengths:focus-visible {
        outline: 2px solid var(--maibuk-color-primary);
        outline-offset: 2px;
      }

      .also-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .also-row {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .also-row .also-text {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .also-title {
        font-size: 0.9375rem;
        font-weight: 600;
      }

      .also-sub {
        font-size: 0.8125rem;
        color: var(--maibuk-color-muted-foreground);
        font-variant-numeric: tabular-nums;
      }

      .mini-track {
        stroke: var(--maibuk-color-muted);
      }

      .mini-value {
        stroke: var(--maibuk-color-primary);
      }

      .link-button {
        min-height: 44px;
        padding: 0 4px;
        border: 0;
        background: transparent;
        color: var(--maibuk-color-foreground);
        font-size: 0.8125rem;
        font-weight: 500;
      }

      .link-button:hover {
        color: var(--maibuk-color-primary-hover);
      }

      .alerts-text {
        margin: 0;
        font-size: 0.875rem;
        line-height: 1.55;
      }

      .hero-stopwatch {
        padding: 56px 24px;
        justify-content: center;
        gap: 40px;
      }

      .stopwatch-main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .stopwatch-time {
        display: flex;
        align-items: baseline;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }

      .stopwatch-digits {
        font-size: 6rem;
        font-weight: 300;
        letter-spacing: -0.045em;
      }

      .stopwatch-hundredths {
        font-size: 2.5rem;
        font-weight: 300;
        color: var(--maibuk-color-muted-foreground);
        letter-spacing: -0.02em;
      }

      .stopwatch-lap {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.875rem;
        color: var(--maibuk-color-muted-foreground);
      }

      .lap-pill {
        display: inline-flex;
        align-items: center;
        padding: 4px 10px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--maibuk-color-primary) 14%, transparent);
        color: var(--maibuk-color-foreground);
        font-weight: 600;
      }

      .stopwatch-lap-time {
        font-variant-numeric: tabular-nums;
      }

      .lap-bars {
        width: 100%;
        max-width: 420px;
        height: 6px;
        display: flex;
        gap: 3px;
      }

      .lap-bar {
        flex: 1 1 0;
        border-radius: 3px;
        background: var(--maibuk-color-muted);
      }

      .lap-bar.current {
        background: var(--maibuk-color-primary);
      }

      .pill {
        min-height: 44px;
        min-width: 128px;
        height: 56px;
        padding: 0 24px;
        border-radius: 28px;
        border: 1px solid var(--maibuk-color-border);
        background: var(--maibuk-color-card);
        color: var(--maibuk-color-card-foreground);
        font-size: 1rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .table-wrap {
        overflow-x: auto;
      }

      .laps-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.875rem;
        font-variant-numeric: tabular-nums;
      }

      .laps-table th {
        text-align: left;
        font-weight: 500;
        color: var(--maibuk-color-muted-foreground);
        font-size: 0.75rem;
        padding: 8px 0;
        border-bottom: 1px solid var(--maibuk-color-border);
      }

      .laps-table th.numeric,
      .laps-table td.numeric {
        text-align: right;
        padding-left: 16px;
      }

      .laps-table td {
        padding: 12px 0;
        border-bottom: 1px solid color-mix(in srgb, var(--maibuk-color-border) 50%, transparent);
      }

      .laps-table td.numeric {
        font-weight: 600;
      }

      .laps-table td.total {
        font-weight: 400;
        color: var(--maibuk-color-muted-foreground);
      }

      .lap-number {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .lap-number .number {
        min-width: 16px;
        color: var(--maibuk-color-muted-foreground);
      }

      .tag {
        font-size: 0.6875rem;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 999px;
      }

      .tag.fastest {
        background: var(--maibuk-color-success-bg);
        color: var(--maibuk-color-success-text);
      }

      .tag.slowest {
        background: var(--maibuk-color-warning-bg);
        color: var(--maibuk-color-warning-text);
      }

      .alarms {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .next-alarm,
      .no-alarms {
        margin: 0;
        font-size: 0.875rem;
        color: var(--maibuk-color-muted-foreground);
      }

      .primary.add-alarm {
        min-width: 0;
        height: 44px;
        padding: 0 20px;
        border-radius: 22px;
        font-size: 0.9375rem;
      }

      .alarm-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 16px;
      }

      .alarm {
        background: var(--maibuk-color-card);
        color: var(--maibuk-color-card-foreground);
        border: 1px solid var(--maibuk-color-border);
        border-radius: 20px;
        padding: 22px 22px 18px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .alarm-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .alarm-text {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }

      .alarm-time {
        font-size: 3rem;
        font-weight: 300;
        letter-spacing: -0.04em;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }

      .alarm-label {
        font-size: 0.875rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .alarm.off .alarm-time,
      .alarm.off .alarm-label {
        color: var(--maibuk-color-muted-foreground);
      }

      .switch {
        flex: none;
        width: 52px;
        min-height: 44px;
        padding: 0;
        border: 0;
        background: transparent;
        display: flex;
        align-items: center;
      }

      .switch .track {
        display: flex;
        align-items: center;
        width: 52px;
        height: 32px;
        padding: 3px;
        border-radius: 16px;
        background: var(--maibuk-color-muted);
      }

      .switch[aria-checked="true"] .track {
        justify-content: flex-end;
        background: var(--maibuk-color-primary);
      }

      .switch .knob {
        width: 26px;
        height: 26px;
        border-radius: 13px;
        background: var(--maibuk-color-card);
        box-shadow: 0 1px 3px color-mix(in srgb, var(--maibuk-color-foreground) 35%, transparent);
      }

      .switch:focus-visible .track {
        outline: 2px solid var(--maibuk-color-primary);
        outline-offset: 2px;
      }

      .alarm-foot {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding-top: 14px;
        border-top: 1px solid var(--maibuk-color-border);
      }

      .alarm-repeat {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 0.8125rem;
        color: var(--maibuk-color-muted-foreground);
      }

      .day-chip {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        border-radius: 12px;
        font-size: 0.6875rem;
        font-weight: 600;
        color: var(--maibuk-color-muted-foreground);
      }

      .day-chip.on {
        background: color-mix(in srgb, var(--maibuk-color-primary) 18%, transparent);
        color: var(--maibuk-color-foreground);
      }

      .alarm-actions {
        display: flex;
        gap: 2px;
      }

      .icon-button {
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        border-radius: 22px;
        background: transparent;
        color: var(--maibuk-color-muted-foreground);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .icon-button:hover {
        background: color-mix(in srgb, var(--maibuk-color-muted) 60%, transparent);
      }

      .icon-button.destructive {
        color: var(--maibuk-color-destructive);
      }

      .overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        /* A dark scrim in both themes, as the host's Modal draws it: the
           foreground token turns light in dark mode and washed the page out. */
        background: rgb(0 0 0 / 50%);
      }

      .dialog {
        width: 100%;
        max-width: 480px;
        max-height: calc(100vh - 48px);
        overflow-y: auto;
        background: var(--maibuk-color-card);
        color: var(--maibuk-color-card-foreground);
        border: 1px solid var(--maibuk-color-border);
        border-radius: 28px;
        --dialog-pad: 32px;
        padding: var(--dialog-pad);
        display: flex;
        flex-direction: column;
        gap: 28px;
        box-shadow: 0 32px 64px -24px
          color-mix(in srgb, var(--maibuk-color-foreground) 45%, transparent);
      }

      .dialog-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .dialog-head h2 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .dialog-close {
        flex: none;
        background: color-mix(in srgb, var(--maibuk-color-muted) 60%, transparent);
        color: var(--maibuk-color-card-foreground);
      }

      .dialog-fields {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        gap: 8px;
      }

      .dialog .field input {
        width: 120px;
        height: 104px;
        font-size: 4rem;
      }

      .dialog .field-separator {
        font-size: 4rem;
        line-height: 104px;
      }

      .dialog-label {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .dialog-label label,
      .dialog-repeat legend {
        font-size: 0.875rem;
        font-weight: 500;
      }

      .dialog-label input {
        height: 48px;
        padding: 0 16px;
        border-radius: 14px;
        border: 1px solid var(--maibuk-color-border);
        background: var(--maibuk-color-background);
        color: var(--maibuk-color-foreground);
        font-size: 0.9375rem;
      }

      .dialog-label input:focus-visible {
        outline: 2px solid var(--maibuk-color-primary);
        outline-offset: 2px;
      }

      .dialog-repeat {
        border: 0;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .dialog-repeat legend {
        padding: 0;
        margin-bottom: 10px;
      }

      .day-toggles {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .day {
        position: relative;
        display: block;
      }

      .day input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
      }

      .day span {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 52px;
        height: 44px;
        border-radius: 12px;
        border: 1px solid var(--maibuk-color-border);
        background: transparent;
        color: var(--maibuk-color-muted-foreground);
        font-size: 0.8125rem;
        font-weight: 600;
      }

      .day input:checked + span {
        border-color: var(--maibuk-color-primary);
        background: var(--maibuk-color-primary);
        color: var(--maibuk-color-primary-foreground);
      }

      .day input:focus-visible + span {
        outline: 2px solid var(--maibuk-color-primary);
        outline-offset: 2px;
      }

      .hint {
        margin: 0;
        font-size: 0.8125rem;
        color: var(--maibuk-color-muted-foreground);
      }

      /* The action row stays pinned to the dialog's bottom edge while a short
         viewport scrolls the fields above it. */
      .dialog-actions {
        position: sticky;
        bottom: calc(-1 * var(--dialog-pad));
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 10px;
        margin: 0 calc(-1 * var(--dialog-pad)) calc(-1 * var(--dialog-pad));
        padding: 16px var(--dialog-pad) var(--dialog-pad);
        background: var(--maibuk-color-card);
      }

      .secondary {
        min-height: 48px;
        padding: 0 22px;
        border-radius: 24px;
        border: 1px solid var(--maibuk-color-border);
        background: var(--maibuk-color-card);
        color: var(--maibuk-color-card-foreground);
        font-size: 0.9375rem;
        font-weight: 600;
      }

      .dialog-actions .primary {
        min-width: 0;
        height: 48px;
        padding: 0 28px;
        border-radius: 24px;
        font-size: 0.9375rem;
      }

      /* The settings dialog's fields pair a label with the dialog's own input,
         one notch tighter than the Alarm editor's oversized time fields. */
      .settings-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      /* Each field spans three rows of the grid (label, input, error), shared
         through subgrid, so the inputs of one row line up even when one label
         wraps to two lines; a short label sits on its input. */
      .settings-field {
        display: grid;
        grid-template-rows: subgrid;
        grid-row: span 3;
        row-gap: 8px;
      }

      .settings-field label {
        align-self: end;
      }

      .settings-field input {
        width: 100%;
        height: 44px;
        padding: 0 14px;
        border-radius: 12px;
        font-variant-numeric: tabular-nums;
      }

      .settings-field input[aria-invalid="true"] {
        border-color: var(--maibuk-color-destructive);
      }

      /* The message keeps its line while empty, so an error never shifts the
         dialog's action row. */
      .field-error {
        margin: 0;
        min-height: 1.1em;
        font-size: 0.75rem;
        line-height: 1.1;
        color: var(--maibuk-color-destructive);
      }

      .settings-switches {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .settings-switch-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        font-size: 0.875rem;
        font-weight: 500;
      }

      /* Reset sits at the start of the action row; Cancel and Save stay at the
         end. A hidden Reset keeps its box, so nothing moves under the pointer. */
      .settings-reset {
        margin-right: auto;
      }

      .reset-hidden {
        visibility: hidden;
      }

      @media (max-width: 640px) {
        #clock {
          padding: 20px 16px 24px;
          gap: 24px;
        }

        .layout {
          flex-direction: column;
        }

        .hero,
        .side {
          flex: 1 1 auto;
        }

        .tabs {
          display: grid;
          grid-template-columns: repeat(4, minmax(0, 1fr));
          gap: 4px;
          border-radius: 16px;
          width: 100%;
        }

        .tab {
          position: relative;
          flex-direction: column;
          justify-content: center;
          gap: 4px;
          min-height: 52px;
          padding: 0 4px;
          border-radius: 12px;
          font-size: 0.6875rem;
          font-weight: 600;
        }

        .tab svg {
          width: 18px;
          height: 18px;
        }

        .tab .dot {
          position: absolute;
          top: 8px;
          right: 14px;
        }

        .hero {
          padding: 32px 16px;
        }

        .round {
          width: 56px;
          height: 56px;
          border-radius: 28px;
        }

        .primary,
        .chip,
        .link-button,
        .banner button {
          min-height: 44px;
        }

        .field input {
          width: 92px;
          height: 96px;
          font-size: 3.5rem;
        }

        .field-separator {
          font-size: 3.5rem;
          line-height: 96px;
        }

        .dial {
          width: 280px;
          height: 280px;
        }

        .dial-time {
          font-size: 4.25rem;
        }

        .stopwatch-digits {
          font-size: 4rem;
        }

        .stopwatch-hundredths {
          font-size: 1.75rem;
        }

        .alarm-list {
          grid-template-columns: minmax(0, 1fr);
        }

        .alarm-time {
          font-size: 2.5rem;
        }

        .dialog {
          --dialog-pad: 24px;
          border-radius: 24px;
        }

        .dialog .field input {
          width: 92px;
          height: 96px;
          font-size: 3.5rem;
        }

        .dialog .field-separator {
          font-size: 3.5rem;
          line-height: 96px;
        }

        .settings-grid {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>

            <button id="alarm-save" class="primary" type="button"></button>
          </div>
        </section>
      </div>

      <div id="pomodoro-settings" class="overlay" hidden>
        <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="pomodoro-settings-title">
          <div class="dialog-head">
            <h2 id="pomodoro-settings-title"></h2>
            <button id="pomodoro-settings-close" class="icon-button dialog-close" type="button">
              <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
            </button>
          </div>
          <div class="settings-grid">
            <div class="dialog-label settings-field">
              <label id="settings-pomodoro-label" for="settings-pomodoro"></label>
              <input id="settings-pomodoro" type="number" min="1" max="99" inputmode="numeric" />
              <p id="settings-pomodoro-error" class="field-error"></p>
            </div>
            <div class="dialog-label settings-field">
              <label id="settings-short-label" for="settings-short"></label>
              <input id="settings-short" type="number" min="1" max="99" inputmode="numeric" />
              <p id="settings-short-error" class="field-error"></p>
            </div>
            <div class="dialog-label settings-field">
              <label id="settings-long-label" for="settings-long"></label>
              <input id="settings-long" type="number" min="1" max="99" inputmode="numeric" />
              <p id="settings-long-error" class="field-error"></p>
            </div>
            <div class="dialog-label settings-field">
              <label id="settings-every-label" for="settings-every"></label>
              <input id="settings-every" type="number" min="1" max="12" inputmode="numeric" />
              <p id="settings-every-error" class="field-error"></p>
            </div>
          </div>
          <div class="settings-switches">
            <div class="settings-switch-row">
              <span id="settings-auto-breaks-label"></span>
              <button
                id="settings-auto-breaks"
                class="switch"
                type="button"
                role="switch"
                aria-checked="false"
                aria-labelledby="settings-auto-breaks-label"
              >
                <span class="track"><span class="knob"></span></span>
              </button>
            </div>
            <div class="settings-switch-row">
              <span id="settings-auto-pomodoros-label"></span>
              <button
                id="settings-auto-pomodoros"
                class="switch"
                type="button"
                role="switch"
                aria-checked="false"
                aria-labelledby="settings-auto-pomodoros-label"
              >
                <span class="track"><span class="knob"></span></span>
              </button>
            </div>
          </div>
          <div class="dialog-actions">
            <button
              id="pomodoro-settings-reset"
              class="secondary settings-reset reset-hidden"
              type="button"
            ></button>
            <button id="pomodoro-settings-cancel" class="secondary" type="button"></button>
            <button id="pomodoro-settings-save" class="primary" type="button"></button>
          </div>
        </section>
      </div>
    </main>

    <script src="clock.js"></script>
  </body>
</html>
