<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Reader</title>
    <style>
      :root {
        color-scheme: var(--maibuk-color-scheme, light dark);
      }

      * {
        box-sizing: border-box;
      }

      /* `hidden` has to win over the `display` rules the Frame's panels set. */
      [hidden] {
        /* biome-ignore lint/complexity/noImportantStyles: the id-selector panel rules (#search-bar, #password-form) outrank [hidden] without it */
        display: none !important;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        background: var(--maibuk-color-background);
        color: var(--maibuk-color-foreground);
        font-family: var(--maibuk-font-sans, system-ui, sans-serif);
        overflow: hidden;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 0.25rem 0.75rem;
        padding: 0.375rem 0.5rem;
        border-bottom: 1px solid var(--maibuk-color-border);
        background: var(--maibuk-color-card);
      }

      .group {
        display: flex;
        align-items: center;
        gap: 0.125rem;
      }

      .divider {
        width: 1px;
        height: 1.25rem;
        margin: 0 0.25rem;
        background: var(--maibuk-color-border);
      }

      button {
        font: inherit;
        padding: 0.35rem 0.65rem;
        border-radius: 0.5rem;
        border: 1px solid var(--maibuk-color-border);
        background: var(--maibuk-color-secondary);
        color: var(--maibuk-color-foreground);
        cursor: pointer;
      }

      button:hover {
        background: var(--maibuk-color-muted);
      }

      .icon-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2rem;
        height: 2rem;
        padding: 0;
        border: 0;
        border-radius: 0.375rem;
        background: transparent;
        color: var(--maibuk-color-muted-foreground);
      }

      .icon-button:hover:not(:disabled) {
        background: var(--maibuk-color-muted);
        color: var(--maibuk-color-foreground);
      }

      .icon-button:disabled {
        opacity: 0.4;
        cursor: default;
      }

      .icon-button[aria-pressed="true"],
      .icon-button[aria-expanded="true"] {
        background: var(--maibuk-color-muted);
        color: var(--maibuk-color-primary);
      }

      .icon-button svg {
        width: 1.125rem;
        height: 1.125rem;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .icon-button .when-fullscreen,
      :root[data-fullscreen="true"] .icon-button .when-windowed {
        display: none;
      }

      :root[data-fullscreen="true"] .icon-button .when-fullscreen {
        display: inline;
      }

      /* The PDF-only controls; a Flowing view sizes its text instead. */
      body[data-mode="flow"] #fit-width,
      body[data-mode="flow"] #fit-page,
      body[data-mode="flow"] .zoom .divider,
      body:not([data-mode="pdf"]) #layout-toggle {
        display: none;
      }

      #page-indicator {
        min-width: 6.5rem;
        text-align: center;
        font-size: 0.875rem;
      }

      #zoom-level {
        min-width: 3rem;
        text-align: center;
        font-size: 0.875rem;
      }

      #page-indicator,
      #zoom-level,
      #search-status {
        font-variant-numeric: tabular-nums;
        color: var(--maibuk-color-muted-foreground);
        white-space: nowrap;
      }

      #search-bar {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.4rem 0.75rem;
        border-bottom: 1px solid var(--maibuk-color-border);
        background: var(--maibuk-color-card);
      }

      #search-input {
        flex: 1;
        min-width: 8rem;
        font: inherit;
        padding: 0.35rem 0.5rem;
        border-radius: 0.4rem;
        border: 1px solid var(--maibuk-color-border);
        background: var(--maibuk-color-background);
        color: var(--maibuk-color-foreground);
      }

      #body {
        flex: 1;
        display: flex;
        min-height: 0;
      }

      #contents {
        width: 18rem;
        max-width: 40vw;
        overflow: auto;
        padding: 0.75rem;
        border-right: 1px solid var(--maibuk-color-border);
        background: var(--maibuk-color-card);
      }

      #contents h2 {
        margin: 0 0 0.5rem;
        font-size: 1rem;
      }

      #contents-tree ul {
        list-style: none;
        margin: 0;
        padding-left: 0.9rem;
      }

      #contents-tree > ul {
        padding-left: 0;
      }

      [role="treeitem"] {
        padding: 0.25rem 0.35rem;
        border-radius: 0.35rem;
        cursor: pointer;
        outline-offset: -1px;
      }

      [role="treeitem"]:hover {
        background: var(--maibuk-color-muted);
      }

      #viewer {
        position: relative;
        flex: 1;
        min-width: 0;
        overflow: auto;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 1rem;
        background: var(--maibuk-color-muted);
      }

      #stage {
        position: relative;
        flex: 0 0 auto;
        background: var(--maibuk-color-background);
        box-shadow: 0 1px 6px rgb(0 0 0 / 18%);
      }

      /* A Flowing Document reads as one page: the area around its text column
         takes the page's color, so the column needs no visible edge. */
      body[data-mode="flow"] #viewer {
        background: var(--maibuk-color-background);
      }

      body[data-mode="flow"] #stage {
        box-shadow: none;
      }

      /* A PDF stage holds one slot per page: one shown at a time, or all of
         them stacked in Continuous scroll. Rendered pages stay in their slot. */
      #stage.pdf-pages {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        background: transparent;
        box-shadow: none;
      }

      .pdf-page {
        position: relative;
        flex: 0 0 auto;
        background: #ffffff;
        box-shadow: 0 1px 6px rgb(0 0 0 / 18%);
      }

      #stage canvas {
        display: block;
        background: #ffffff;
      }

      /* pdf.js puts the selectable text over the canvas; the viewer CSS that
         travels with the display source carries the rest of the text-layer rules. */
      #text-layer {
        position: absolute;
        inset: 0;
        overflow: hidden;
        line-height: 1;
        text-align: initial;
        text-size-adjust: none;
        transform-origin: 0 0;
        opacity: 1;
        z-index: 2;
      }

      .reader-search-hit {
        background: var(--maibuk-color-warning-bg);
        color: inherit;
        border-radius: 2px;
      }

      .reader-search-hit.is-current {
        background: var(--maibuk-color-primary);
        color: var(--maibuk-color-primary-foreground);
      }

      #message {
        margin: 2rem auto;
        max-width: 34rem;
        color: var(--maibuk-color-muted-foreground);
        text-align: center;
        line-height: 1.5;
      }

      #message[data-error="true"] {
        color: var(--maibuk-color-error-text);
      }

      #password-form {
        margin: 3rem auto;
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        width: min(22rem, 100%);
        padding: 1.25rem;
        border-radius: 0.75rem;
        border: 1px solid var(--maibuk-color-border);
        background: var(--maibuk-color-card);
      }

      #password-form h2 {
        margin: 0;
        font-size: 1.1rem;
      }

      #password-input {
        font: inherit;
        padding: 0.45rem 0.55rem;
        border-radius: 0.4rem;
        border: 1px solid var(--maibuk-color-border);
        background: var(--maibuk-color-background);
        color: var(--maibuk-color-foreground);
      }

      #password-error {
        margin: 0;
        color: var(--maibuk-color-error-text);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="group">
        <button id="back" class="icon-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
        <button id="contents-toggle" class="icon-button" type="button" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/></svg></button>
        <button id="find-toggle" class="icon-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
      </div>
      <div class="group pager">
        <button id="page-previous" class="icon-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
        <span id="page-indicator" aria-live="polite"></span>
        <button id="page-next" class="icon-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
      <div class="group zoom">
        <button id="zoom-out" class="icon-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M8 11h6"/></svg></button>
        <span id="zoom-level">100%</span>
        <button id="zoom-in" class="icon-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="M8 11h6"/><path d="M11 8v6"/></svg></button>
        <span class="divider" aria-hidden="true"></span>
        <button id="fit-width" class="icon-button" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 8 4 4-4 4"/><path d="M2 12h20"/><path d="m6 8-4 4 4 4"/></svg></button>
        <button id="fit-page" class="icon-button" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20"/><path d="m8 18 4 4 4-4"/><path d="m8 6 4-4 4 4"/></svg></button>
        <button id="layout-toggle" class="icon-button" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2" width="14" height="9" rx="1.5"/><rect x="5" y="13" width="14" height="9" rx="1.5"/></svg></button>
        <button id="fullscreen-toggle" class="icon-button" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><g class="when-windowed"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></g><g class="when-fullscreen"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></g></svg></button>
      </div>
    </header>

    <div id="search-bar" hidden>
      <input id="search-input" type="search" autocomplete="off" />
      <span id="search-status" aria-live="polite"></span>
      <button id="search-previous" class="icon-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg></button>
      <button id="search-next" class="icon-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <button id="search-close" class="icon-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>

    <div id="body">
      <aside id="contents" hidden aria-labelledby="contents-title">
        <h2 id="contents-title">Contents</h2>
        <div id="contents-tree" role="tree"></div>
      </aside>

      <main id="viewer">
        <div id="stage" hidden>
          <canvas id="page"></canvas>
          <div id="text-layer" class="textLayer"></div>
        </div>
        <p id="message" hidden></p>
        <form id="password-form" hidden>
          <h2 id="password-title">This PDF is password-protected</h2>
          <label for="password-input" id="password-label">Password</label>
          <input id="password-input" type="password" autocomplete="off" />
          <p id="password-error" hidden></p>
          <button id="password-submit" type="submit">Open</button>
        </form>
      </main>
    </div>

    <script src="sanitizer.js"></script>
    <script src="reader.js"></script>
  </body>
</html>
