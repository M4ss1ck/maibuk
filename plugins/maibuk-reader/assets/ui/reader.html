<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Reader</title>
    <style>
      :root {
        color-scheme: var(--maibuk-color-scheme, light dark);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--maibuk-color-background, #ffffff);
        color: var(--maibuk-color-foreground, #1a1a1a);
        font-family: var(--maibuk-font-sans, system-ui, sans-serif);
      }

      header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid var(--maibuk-color-border, #d4d4d4);
        background: var(--maibuk-color-card, #f5f5f5);
      }

      button {
        font: inherit;
        padding: 0.4rem 0.75rem;
        border-radius: 0.5rem;
        border: 1px solid var(--maibuk-color-border, #d4d4d4);
        background: var(--maibuk-color-secondary, #ffffff);
        color: var(--maibuk-color-foreground, #1a1a1a);
        cursor: pointer;
      }

      button:hover {
        background: var(--maibuk-color-muted, #ececec);
      }

      button:focus-visible {
        outline: 2px solid var(--maibuk-color-primary, #2563eb);
        outline-offset: 2px;
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 2rem 1rem;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-family: var(--maibuk-font-serif, Georgia, serif);
        font-size: 1.75rem;
        font-weight: 600;
      }

      p {
        margin: 0;
        color: var(--maibuk-color-muted-foreground, #555555);
      }
    </style>
  </head>
  <body>
    <header>
      <button id="back" type="button">Back to Shelf</button>
    </header>
    <main>
      <h1 id="title">Reader</h1>
      <p id="note">The reading surface arrives in a later update.</p>
    </main>
    <script src="reader.js"></script>
  </body>
</html>
