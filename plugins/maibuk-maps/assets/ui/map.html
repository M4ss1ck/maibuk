<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Map</title>
    <!-- The bundled Map Label faces (#751) live in a linked stylesheet, which
         the Frame shim rewrites and loads; an inline style's url() is not
         rewritten and would never load. -->
    <link rel="stylesheet" href="fonts.css" />
    <style>
      /* The Map drawing surface (#745). Every colour comes from the host's
         public theme tokens, so the Frame follows a light/dark flip; the Map's
         own water and ink colours arrive with the scene, as Map Style data. */
      :root {
        color-scheme: var(--maibuk-color-scheme, light dark);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: var(--maibuk-color-muted);
        color: var(--maibuk-color-foreground);
        font-family: var(--maibuk-font-sans, system-ui, sans-serif);
      }

      #surface {
        position: absolute;
        inset: 0;
      }

      /* The svg covers the Frame and owns every pointer gesture the surface
         accepts: touch scrolling and pinch-zoom must never take over a stroke. */
      #surface svg {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      /* Every drawing tool shows a crosshair; Select shows the pointer. */
      #surface svg[data-tool="pencil"],
      #surface svg[data-tool="pen"],
      #surface svg[data-tool="bucket"],
      #surface svg[data-tool="area"],
      #surface svg[data-tool="insert"],
      #surface svg[data-tool="text"],
      #surface svg[data-tool="eraser"],
      #surface svg[data-tool="ellipse"],
      #surface svg[data-tool="rectangle"],
      #surface svg[data-tool="polygon"] {
        cursor: crosshair;
      }

      #surface svg[data-tool="select"] {
        cursor: default;
      }
      /* The Hand shows the open hand, and every pan in progress, whatever
         started it, shows the closed one. */
      #surface svg[data-tool="hand"] {
        cursor: grab;
      }
      #surface svg[data-panning="true"],
      #surface svg[data-panning="true"] * {
        cursor: grabbing;
      }
      /* With Select, an Element a drag can move shows the move cursor (#766),
         and the one being dragged keeps it while it follows the pointer. A
         drag never selects the Stamps' label text. */
      #surface svg[data-tool="select"] g[data-movable="true"],
      #surface svg[data-tool="select"] g[data-dragging="true"] {
        cursor: move;
      }
      #surface svg {
        user-select: none;
        -webkit-user-select: none;
      }

      /* The Map Label being written in its on-map text box (#800) hides its
         ink, so the box's own letters are the only ones on the page. */
      #surface g[data-editing="true"] {
        visibility: hidden;
      }

      /* The on-map text box (#800): a bare textarea seated over its label,
         typing in the label's own face, size, spacing, and ink, which the
         Frame sets on it. It draws no frame of its own beyond a dashed edge,
         turns from its top-left corner, and keeps the layout's plain advances,
         as the drawn label does. */
      .map-label-editor {
        position: fixed;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 0;
        outline: 1px dashed var(--maibuk-color-primary, #2563eb);
        outline-offset: 2px;
        background: transparent;
        resize: none;
        overflow: hidden;
        text-align: center;
        overflow-wrap: anywhere;
        font-kerning: none;
        font-variant-ligatures: none;
        transform-origin: 0 0;
        z-index: 1;
      }
      .map-label-editor::placeholder {
        color: inherit;
        font-style: italic;
        opacity: 0.5;
      }

      /* A Map Line is page ink: its width is page millimetres, so zooming in
         shows a thicker line, exactly as the Maps list preview does. The Map's
         paper is the Map Style's light water in both themes (a printed map, like
         a Reader page), so each shape's own stroke and fill stay the Map
         Style's colours in either scheme and arrive with the scene, on the
         shape's `stroke` and `fill` attributes; the theme's foreground would
         draw near-white ink on light paper in the dark theme. */
      .map-line {
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* The selection outline sits under the ink, wider and in the accent, so
         it reads in both themes without hiding the stroke it marks. */
      .map-selection {
        fill: none;
        stroke: var(--maibuk-color-primary);
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-opacity: 0.55;
      }

      /* An invisible, wide, constant-pixel target: a 0.6 mm line is too thin to
         hit with a finger or a mouse at page scale. A filled shape such as a
         river is picked by its area instead of only by its outline. */
      .map-hit {
        fill: none;
        stroke: transparent;
        stroke-width: 12px;
        vector-effect: non-scaling-stroke;
        pointer-events: stroke;
      }

      .map-hit[data-fill="true"] {
        pointer-events: fill;
      }

      /* The stroke being drawn, before the Worker answers with the smoothed
         Map Line it keeps: an accent darker than the paper in both themes. */
      .map-live {
        fill: none;
        stroke: var(--maibuk-color-primary-hover);
        stroke-width: 0.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* The keyboard Pen's crosshair, where the next point lands: the same
         accent, thin enough to read as a guide rather than ink. */
      .map-crosshair {
        fill: none;
        stroke: var(--maibuk-color-primary-hover);
        stroke-width: 0.4;
        stroke-linecap: round;
        opacity: 0.8;
      }

      /* A Shape tool's drag preview: the outline the drag would draw, dashed so
         it reads as a guide rather than ink until the Worker keeps the Shape. */
      .map-shape-preview {
        fill: none;
        stroke: var(--maibuk-color-primary-hover);
        stroke-width: 0.6;
        stroke-dasharray: 1.5 1;
        stroke-linecap: round;
        stroke-linejoin: round;
        pointer-events: none;
      }

      /* A selected Map Label's bend handle (#751): the pointer's grip on the
         curve, at the apex of its baseline, in the same accent as the selection
         it belongs to. It is a pointer affordance only; the panel's Bend field
         is the keyboard path. */
      .map-bend-handle {
        fill: var(--maibuk-color-primary);
        fill-opacity: 0.2;
        stroke: var(--maibuk-color-primary);
        stroke-width: 0.5;
        pointer-events: all;
        cursor: grab;
      }

      /* The curve a bend drag would draw, until the Worker keeps it. */
      .map-bend-preview {
        fill: none;
        stroke: var(--maibuk-color-primary-hover);
        stroke-width: 0.4;
        stroke-dasharray: 1.5 1;
        stroke-linecap: round;
        pointer-events: none;
      }

      /* A selected Stamp's or Map Image's transform handles (#795): its box, the
         corner grips, and the turn grip on its stalk. Their geometry is sized in
         page millimetres from the screen scale, so they keep their size on screen
         at every zoom; the strokes stay a pixel wide by not scaling, so a grip's
         edge is as crisp when zoomed in as the selection outline is. They mark
         and grip the Element rather than paint it, so only the wider, invisible
         targets under them take a pointer. */
      .map-transform-box,
      .map-transform-stalk,
      .map-transform-handle {
        fill: none;
        stroke: var(--maibuk-color-primary);
        stroke-width: 1.5;
        vector-effect: non-scaling-stroke;
        pointer-events: none;
      }

      .map-transform-handle {
        fill: var(--maibuk-color-primary);
        fill-opacity: 0.2;
      }

      /* The grip under the pointer (#795) is the one a press would take, so it
         fills solid; the Frame draws it larger too, in page millimetres. */
      .map-transform-handle[data-hovered="true"] {
        fill-opacity: 1;
      }

      /* A locked Element cannot be resized or turned: its box is dashed, and a
         small padlock badge hangs on its corner instead of grips. */
      .map-transform[data-locked="true"] .map-transform-box {
        stroke-dasharray: 4 3;
      }

      .map-transform-lock {
        pointer-events: none;
      }

      .map-transform-lock-body {
        fill: var(--maibuk-color-primary);
      }

      .map-transform-lock-shackle {
        fill: none;
        stroke: var(--maibuk-color-primary);
        stroke-width: 1.5;
        stroke-linecap: round;
        vector-effect: non-scaling-stroke;
      }

      .map-transform-hit {
        fill: transparent;
        stroke: none;
        pointer-events: all;
      }

      /* The box a resize started from (#795): dashed, so the author compares
         the old size with the live one. It guides rather than grips, so it
         never takes a pointer. */
      .map-transform-ghost {
        fill: none;
        stroke: var(--maibuk-color-primary);
        stroke-width: 1;
        stroke-dasharray: 4 3;
        vector-effect: non-scaling-stroke;
        opacity: 0.6;
        pointer-events: none;
      }

      /* One tick at every 15° step while a Shift turn runs (#795), so the
         author sees where the snap will land. */
      .map-transform-tick {
        stroke: var(--maibuk-color-primary);
        stroke-width: 1.5;
        stroke-linecap: round;
        vector-effect: non-scaling-stroke;
        pointer-events: none;
      }

      /* The readout chip beside the pointer during a drag (#795): the host's
         foreground as its surface and the page colour as its ink, so it reads
         in both themes over the Map's own paper. Its geometry is sized in page
         millimetres from the screen scale, like the handles. */
      .map-readout {
        pointer-events: none;
      }

      .map-readout-chip {
        fill: var(--maibuk-color-foreground);
        fill-opacity: 0.85;
      }

      .map-readout-text {
        fill: var(--maibuk-color-background);
      }
    </style>
  </head>
  <body>
    <div id="surface"></div>
    <script src="lib/htm-preact-standalone.umd.js"></script>
    <!-- An uploaded picture is cleaned and measured in this document (#756):
         DOMPurify, then the rules `svg-ingest.js` adds to it. Both load before
         map.js, which only reaches them when a Worker sends one. -->
    <script src="lib/purify.min.js"></script>
    <script src="svg-ingest.js"></script>
    <script src="map.js"></script>
  </body>
</html>
