name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A newer push to the same PR makes the running checks moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Everything that fails in seconds runs apart from the tests, so a type error
  # or lint error reports in about a minute instead of after the whole suite.
  checks:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch dictation runtime
        run: pnpm fetch:dictation

      # Biome lint, format, and assist at zero errors, warnings, and infos.
      - name: Lint
        run: pnpm lint

      # Vitest strips types without checking them: test files only meet tsc here.
      - name: Typecheck
        run: pnpm typecheck

      # A use of an @deprecated symbol fails here, so a dependency bump that
      # deprecates something we call migrates it in the same PR (issue #670).
      - name: No deprecated APIs
        run: pnpm check:deprecated

      # Playwright never runs in CI, but a broken e2e config or spec should
      # fail here, not in a local run (issue #472).
      - name: Typecheck e2e suite
        run: pnpm exec tsc --noEmit -p e2e

      - name: Test the release changelog generator
        run: pnpm test:release

      - name: Build web target
        run: pnpm build:web

  # Every agent session loads AGENTS.md whole, so it has a word budget; the
  # reference material lives behind its pointers (issue #421).
  agents-budget:
    name: AGENTS.md word budget
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: Check the AGENTS.md word budget
        run: node scripts/agents-word-budget.mjs AGENTS.md

  # The suite in parallel shards. Each shard records its results and coverage
  # as a blob; the coverage job merges them and enforces the thresholds on the
  # whole, since a shard alone covers a third of the code.
  tests:
    name: Tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch dictation runtime
        run: pnpm fetch:dictation

      - name: Run tests
        run: >-
          pnpm exec vitest run --coverage
          --coverage.thresholds.lines=0 --coverage.thresholds.functions=0
          --coverage.thresholds.statements=0 --coverage.thresholds.branches=0
          --shard=${{ matrix.shard }}/3 --reporter=default --reporter=blob

      - name: Upload shard report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          # One name per attempt: "Re-run failed jobs" keeps the old report,
          # and the coverage job picks the newest (scripts/latest-shard-reports.mjs).
          name: vitest-blob-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1

  # The slow Plugin-tooling lane (issue #455): the template is copied into a path
  # with spaces, set up, and checked end to end, plus the built-in layout
  # equivalence. It spawns tsx, Vite, tsc, biome, and vitest, so it runs once,
  # after the unit tests, never inside the sharded suite.
  plugin-tooling:
    name: Plugin tooling
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the Plugin tooling lane
        run: pnpm test:plugin-tooling

  # Also runs when a shard failed: the merge prints the time budget report
  # (tests past half their timeout), which is what explains a timeout.
  coverage:
    name: Coverage gates
    needs: tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          path: .vitest-artifacts

      - name: Pick the newest report of each shard
        run: node scripts/latest-shard-reports.mjs .vitest-artifacts .vitest-reports

      - name: Merge reports and check coverage thresholds
        run: pnpm exec vitest run --mergeReports --coverage
