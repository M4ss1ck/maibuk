name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.1.8). Leave empty to use current version."
        required: false
        type: string

jobs:
  # Ensure version is synced across all files before building
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Sync version across files
        if: github.event.inputs.version != ''
        run: |
          chmod +x ./scripts/bump-version.sh
          ./scripts/bump-version.sh ${{ github.event.inputs.version }}

      - name: Get version
        id: get_version
        run: |
          VERSION=$(grep -Po '"version":\s*"\K[^"]+' package.json | head -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Extract changelog notes
        id: changelog
        run: |
          # Pull the top (latest) section from CHANGELOG.md, dropping the version
          # header line. Falls back to empty if CHANGELOG.md is missing, in which
          # case the release steps use GitHub's auto-generated notes.
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk '/^## \[/{c++} c==1' CHANGELOG.md | tail -n +2)
          else
            NOTES=""
          fi
          {
            echo 'notes<<CHANGELOG_EOF'
            echo "$NOTES"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Verify versions are in sync
        run: |
          PKG_VERSION=$(grep -Po '"version":\s*"\K[^"]+' package.json | head -1)
          TAURI_VERSION=$(grep -Po '"version":\s*"\K[^"]+' src-tauri/tauri.conf.json | head -1)
          CARGO_VERSION=$(grep -Po '^version = "\K[^"]+' src-tauri/Cargo.toml | head -1)

          echo "package.json version: $PKG_VERSION"
          echo "tauri.conf.json version: $TAURI_VERSION"
          echo "Cargo.toml version: $CARGO_VERSION"

          if [[ "$PKG_VERSION" != "$TAURI_VERSION" ]] || [[ "$PKG_VERSION" != "$CARGO_VERSION" ]]; then
            echo "Error: Version mismatch detected!"
            echo "Run './scripts/bump-version.sh $PKG_VERSION' to sync versions."
            exit 1
          fi

  quality:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run test suite with coverage gates
        run: pnpm test:coverage

  # Build for Linux (deb, rpm, appimage)
  build-linux:
    needs: [prepare, quality]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ needs.prepare.outputs.version }}
          releaseName: "Maibuk v${{ needs.prepare.outputs.version }}"
          releaseBody: ${{ needs.prepare.outputs.changelog }}
          releaseDraft: true
          prerelease: false
          args: --target x86_64-unknown-linux-gnu

      - name: Upload Linux artifacts for Arch build
        uses: actions/upload-artifact@v7
        with:
          name: linux-build-artifacts
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/maibuk
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/
            src-tauri/icons/128x128.png
          retention-days: 1

  # Build for Windows using GNU toolchain
  build-windows:
    needs: [prepare, quality]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install cross-compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 \
            nsis \
            llvm \
            clang \
            lld \
            libappindicator3-dev

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ needs.prepare.outputs.version }}
          releaseName: "Maibuk v${{ needs.prepare.outputs.version }}"
          releaseBody: ${{ needs.prepare.outputs.changelog }}
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-gnu

  # Build signed per-ABI Android APKs (separate arm64-v8a and x86_64)
  build-android:
    needs: [prepare, quality]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build-tools and NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "build-tools;36.0.0" "platforms;android-36" "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install frontend dependencies
        run: pnpm install

      - name: Restore Android signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::error::Android signing secrets are missing. Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS in repo secrets."
            exit 1
          fi
          SIGNING_DIR="$HOME/.config/maibuk/android-signing"
          KEYSTORE="$SIGNING_DIR/android-release.jks"
          mkdir -p "$SIGNING_DIR"
          chmod 700 "$SIGNING_DIR"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          {
            printf 'MAIBUK_ANDROID_KEYSTORE=%q\n' "$KEYSTORE"
            printf 'MAIBUK_ANDROID_KEY_ALIAS=%q\n' "$ANDROID_KEY_ALIAS"
            printf 'MAIBUK_ANDROID_KEYSTORE_PASSWORD=%q\n' "$ANDROID_KEYSTORE_PASSWORD"
          } > "$SIGNING_DIR/credentials.env"
          chmod 600 "$KEYSTORE" "$SIGNING_DIR/credentials.env"

      - name: Build signed Android APK
        run: pnpm build:android

      - name: Rename APKs to release filenames
        id: apk
        run: |
          APK_DIR="src-tauri/gen/android/app/build/outputs/apk"
          VERSION="${{ needs.prepare.outputs.version }}"
          cp "$APK_DIR/arm64/release/maibuk-arm64-v8a.apk" "maibuk_${VERSION}_android_arm64-v8a.apk"
          cp "$APK_DIR/x86_64/release/maibuk-x86_64.apk" "maibuk_${VERSION}_android_x86_64.apk"

      - name: Upload Android APKs to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            maibuk_${{ needs.prepare.outputs.version }}_android_arm64-v8a.apk
            maibuk_${{ needs.prepare.outputs.version }}_android_x86_64.apk
          tag_name: v${{ needs.prepare.outputs.version }}
          draft: true
          body: ${{ needs.prepare.outputs.changelog }}
          generate_release_notes: ${{ needs.prepare.outputs.changelog == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build Arch Linux package using Docker
  build-arch:
    needs: [prepare, quality, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: linux-build-artifacts
          path: ./artifacts

      - name: Prepare artifacts for Arch build
        run: |
          # Debug: Show what was downloaded
          echo "=== Downloaded artifacts structure ==="
          find ./artifacts -type f

          # Create the expected directory structure
          mkdir -p src-tauri/target/release/bundle/deb
          mkdir -p src-tauri/icons

          # Move artifacts to expected locations
          cp ./artifacts/target/x86_64-unknown-linux-gnu/release/maibuk src-tauri/target/release/maibuk
          cp -r ./artifacts/target/x86_64-unknown-linux-gnu/release/bundle/deb/* src-tauri/target/release/bundle/deb/
          cp ./artifacts/icons/128x128.png src-tauri/icons/

          # Make binary executable
          chmod +x src-tauri/target/release/maibuk

          # List what we have
          echo "=== Prepared artifacts ==="
          find src-tauri/target/release -type f | head -20
          ls -la src-tauri/icons/

      - name: Build Arch Linux package
        run: |
          chmod +x ./scripts/build-arch-package.sh
          ./scripts/build-arch-package.sh

      - name: Upload Arch package to release
        uses: softprops/action-gh-release@v3
        with:
          files: src-tauri/target/release/bundle/arch/*.pkg.tar.zst
          tag_name: v${{ needs.prepare.outputs.version }}
          draft: true
          body: ${{ needs.prepare.outputs.changelog }}
          generate_release_notes: ${{ needs.prepare.outputs.changelog == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
